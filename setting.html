<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="resources/reset.css" />
    <link rel="stylesheet" href="scss/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,400;1,100&display=swap"
      rel="stylesheet"
    />
    <title>Setting</title>
    <style>
      .formula-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .formula-link {
        flex-grow: 1;
      }

      .icons-wrapper {
        display: flex;
        gap: 8px;
      }

      .formula-edit-input {
        font-size: 1rem;
        padding: 4px 8px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .btn.save {
        background-color: black;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
      }

      .btn.save.disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .create-formula-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
        padding: 10px 18px;
        background-color: black;
        color: white;
        text-decoration: none;
        font-weight: 500;
        border-radius: 6px;
        font-size: 1rem;
        transition: background-color 0.2s ease;
      }

      .create-formula-btn:hover {
        background-color: #222;
      }

      .plus-icon {
        font-size: 1.2rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="wrapper">
        <nav class="headers-wrapper">
          <a href="index.html" class="headers">Home</a>
          <a href="settings.html" class="headers">Setting Name</a>
        </nav>
        <div class="btn-wrapper">
          <button class="btn discard disabled" disabled>Discard</button>
          <button class="btn save disabled" disabled>Save</button>
          <button class="btn create-formula">Create formula</button>
        </div>
      </header>

      <div class="setting-form-wrapper">
        <label for="settingTitle" class="title">Formula Title</label>
        <input
          type="text"
          id="settingTitle"
          class="input settingTitleInput"
          placeholder="Enter formula name"
          disabled
        />
      </div>

      <div class="img-wrapper">
        <img src="Group 182.png" alt="chair" class="img" />
        <p class="text">Oopsie, seems that you have no formulas yet</p>
        <p class="little-text">Create your first formula!</p>
        <a href="formula.html" class="create-formula-btn">
          <span class="plus-icon">+</span>
        </a>
      </div>

      <div class="formulas-wrapper hidden">
        <h3 class="h3">Formulas</h3>
        <ul class="formula-list"></ul>
      </div>

      <li class="formulaTemplateElem hidden">
        <div class="formula-row">
          <span class="formula-link">Formula Title</span>
          <div class="icons-wrapper">
            <a href="#" class="list-btn editBtn">
              <img src="Edit.png" alt="edit icon" />
            </a>
            <button class="list-btn removeBtn">
              <img src="Delete.png" alt="delete icon" />
            </button>
          </div>
        </div>
      </li>
    </div>

    <script>
      const input = document.querySelector(".settingTitleInput");
      const saveBtn = document.querySelector(".save");
      const discardBtn = document.querySelector(".discard");
      const createBtn = document.querySelector(".create-formula");
      const formulaList = document.querySelector(".formula-list");
      const emptyState = document.querySelector(".img-wrapper");
      const formulasWrapper = document.querySelector(".formulas-wrapper");
      const template = document.querySelector(".formulaTemplateElem");

      let formulas = [];

      createBtn.addEventListener("click", () => {
        input.removeAttribute("disabled");
        input.value = "";
        input.focus();

        saveBtn.disabled = true;
        discardBtn.disabled = true;
        saveBtn.classList.add("disabled");
        discardBtn.classList.add("disabled");
      });

      input.addEventListener("input", () => {
        const hasText = input.value.trim() !== "";
        saveBtn.disabled = !hasText;
        discardBtn.disabled = !hasText;
        saveBtn.classList.toggle("disabled", !hasText);
        discardBtn.classList.toggle("disabled", !hasText);
      });

      discardBtn.addEventListener("click", () => {
        input.value = "";
        input.setAttribute("disabled", true);
        saveBtn.disabled = true;
        discardBtn.disabled = true;
        saveBtn.classList.add("disabled");
        discardBtn.classList.add("disabled");
      });

      saveBtn.addEventListener("click", () => {
        const title = input.value.trim();
        if (!title) return;

        const newFormula = {
          id: Date.now(),
          title: title,
        };

        formulas.push(newFormula);
        renderFormula(newFormula);

        input.value = "";
        input.setAttribute("disabled", true);
        saveBtn.disabled = true;
        discardBtn.disabled = true;
        saveBtn.classList.add("disabled");
        discardBtn.classList.add("disabled");
      });

      function renderFormula(formula) {
        const clone = template.cloneNode(true);
        clone.classList.remove("hidden");
        clone.id = formula.id;

        const titleElem = clone.querySelector(".formula-link");
        titleElem.textContent = formula.title;

        const editBtn = clone.querySelector(".editBtn");
        editBtn.addEventListener("click", (e) => {
          e.preventDefault();
          const inputEdit = document.createElement("input");
          inputEdit.type = "text";
          inputEdit.value = formula.title;
          inputEdit.className = "formula-edit-input";

          clone
            .querySelector(".formula-row")
            .replaceChild(inputEdit, titleElem);
          inputEdit.focus();

          inputEdit.addEventListener("blur", () => {
            const newTitle = inputEdit.value.trim();
            if (newTitle) {
              formula.title = newTitle;
              titleElem.textContent = newTitle;
            }
            clone
              .querySelector(".formula-row")
              .replaceChild(titleElem, inputEdit);
          });

          inputEdit.addEventListener("keydown", (e) => {
            if (e.key === "Enter") inputEdit.blur();
          });
        });

        const removeBtn = clone.querySelector(".removeBtn");
        removeBtn.addEventListener("click", () => {
          formulas = formulas.filter((f) => f.id !== formula.id);
          clone.remove();
          toggleEmptyState();
        });

        formulaList.appendChild(clone);
        toggleEmptyState();
      }

      function toggleEmptyState() {
        if (formulas.length === 0) {
          formulasWrapper.classList.add("hidden");
          emptyState.classList.remove("hidden");
        } else {
          emptyState.classList.add("hidden");
          formulasWrapper.classList.remove("hidden");
        }
      }
    </script>
  </body>
</html>
